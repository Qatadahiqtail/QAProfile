<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a3470"/>
      <stop offset="60%" stop-color="#2a1d42"/>
      <stop offset="100%" stop-color="#171021"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2ccff"/>
      <stop offset="100%" stop-color="#a472f5"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer halo -->
  <circle cx="100" cy="100" r="100" fill="url(#halo)"/>
  <!-- badge -->
  <circle cx="100" cy="100" r="82" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="81" fill="none" stroke="#b48cff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- decorative orbit arc -->
  <path d="M34 124 A70 70 0 0 1 60 42" fill="none" stroke="#b48cff" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round"/>

  <g filter="url(#glow)" stroke="url(#stroke)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Q bowl -->
    <circle cx="98" cy="96" r="38" stroke-width="11"/>
    <!-- Q tail -->
    <path d="M120 118 L142 140" stroke-width="11"/>
    <!-- </> inside -->
    <path d="M85 87 L76 96 L85 105" stroke-width="4"/>
    <path d="M95 108 L102 84" stroke-width="4"/>
    <path d="M111 87 L120 96 L111 105" stroke-width="4"/>
  </g>
</svg>
